! Live BGP/PIM configuration; WAN default route belongs to networkd DHCP.
frr defaults traditional
hostname gateway
log stdout
service integrated-vtysh-config
!
ip route 10.0.0.0/8 reject
ipv6 route fd42:dfb5:24e4:1::/64 fd74:f571:d3bd:40:41d7:bb2e:6c90:a8f5
!
interface bond0.20
 ip igmp
 ip igmp query-max-response-time 10
 ip igmp version 2
 ip pim
 ipv6 mld
 ipv6 pim
exit
!
interface bond0.40
 ip igmp
 ip igmp query-max-response-time 10
 ip igmp version 2
 ip pim
 ipv6 mld
 ipv6 pim
exit
!
router bgp 65000
 bgp router-id 10.254.254.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor KATL-LAB peer-group
 neighbor KATL-LAB remote-as 64513
 neighbor 10.1.1.110 peer-group KATL-LAB
 neighbor 10.1.1.110 description katl-cp-1
 neighbor 10.1.1.111 peer-group KATL-LAB
 neighbor 10.1.1.111 description katl-cp-2
 neighbor 10.1.1.112 peer-group KATL-LAB
 neighbor 10.1.1.112 description katl-cp-3
 neighbor 10.254.0.1 remote-as 65001
 neighbor 10.254.0.1 description ICX7250 core
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 10.0.0.0/8
  network 10.0.11.0/24
  network 10.1.0.0/24
  network 10.1.1.0/24
  network 10.1.2.0/24
  network 10.1.3.0/24
  network 10.5.0.0/24
  network 10.254.254.1/32
  network 172.16.0.0/12
  network 192.168.0.0/16
  network 192.168.2.0/24
  neighbor KATL-LAB activate
  neighbor KATL-LAB maximum-prefix 256
  neighbor KATL-LAB route-map KATL-LAB-IN in
  neighbor KATL-LAB route-map KATL-LAB-OUT out
  neighbor 10.254.0.1 activate
  neighbor 10.254.0.1 route-map BGP-ALLOW-ALL in
  neighbor 10.254.0.1 route-map BGP-ALLOW-ALL out
  maximum-paths 3
 exit-address-family
exit
!
ip prefix-list KATL-LAB-VIPS seq 10 permit 172.31.250.0/24 ge 32 le 32
!
route-map BGP-ALLOW-ALL permit 10
exit
!
route-map KATL-LAB-IN permit 10
 match ip address prefix-list KATL-LAB-VIPS
exit
!
route-map KATL-LAB-IN deny 10000
exit
!
route-map KATL-LAB-OUT deny 10000
exit
!
!
end
